name: Publier sur winget

# Deux facons de le lancer :
#
# - AUTOMATIQUEMENT, par release-windows.yml, qui l'appelle dans un job `winget` distinct apres le
#   build, sur un push de tag `vX.Y.Z` uniquement. Jamais sur un `workflow_dispatch` de
#   release-windows, qui sert a rejouer une release deja publiee : rouvrir alors une PR sur une
#   version que winget connait deja ne produirait qu'un doublon.
# - A LA MAIN, ici, pour republier ou rattraper une version.
#
# Publier sur winget ouvre une pull request sur `microsoft/winget-pkgs`, depot tiers revu par des
# mainteneurs externes.
#
# Un job SEPARE et sans `continue-on-error`, sur la lecon de justmakeq : son etape winget, placee
# dans le job de release avec `continue-on-error: true`, est restee en panne sans que personne le
# voie depuis la beta.81, puis a la beta.98. Ici un echec rend le run rouge, alors que la release
# est deja publiee puisque c'est un autre job.
#
# Pas de variable d'opt-in enchainee ici, contrairement a ce qu'on faisait avant sur les apps
# mobiles de l'ecosysteme : ce mecanisme (vars.AUTO_PUBLISH_STORES + reinitialisation a false en
# fin de job) reposait sur un token qui repondait systematiquement 401 sans faire echouer l'etape.
# La variable restait donc bloquee a `true` et tout se publiait automatiquement, exactement ce
# qu'elle etait censee empecher. Un workflow qui ne tourne que quand on le lance n'a pas ce
# probleme. Voir appermittent/publish-ios.yml et publish-android.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string
      dry_run:
        description: 'Essai a blanc : genere le manifeste, n''ouvre AUCUNE pull request'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string
      dry_run:
        description: 'Essai a blanc : genere le manifeste, n''ouvre AUCUNE pull request'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  winget:
    name: Mettre a jour le manifest Breizhzion.BeamMeUp
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # La politique de confidentialite doit decrire ce que le code de CETTE version ecrit sur le
      # disque. Une version qui part toute seule sur winget ne passe plus sous les yeux de personne,
      # et c'est un moderateur winget, pas nous, qui a releve la premiere politique fausse. Un
      # echec ici BLOQUE la publication : il demande une relecture, pas un correctif automatique.
      # Sur un tag, le checkout prend le code tague ; en lancement manuel, celui de la branche.
      - uses: actions/checkout@v7

      - name: Politique de confidentialite a jour avec le code
        shell: pwsh
        run: |
          python scripts/verifier-ecritures-disque.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Retrouver l'installeur de la release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$($env:VERSION)"
          # L'asset NSIS est celui que winget installe : le MSI est publie aussi, mais le manifest
          # ne reference qu'un installeur par architecture.
          $asset = (gh release view $tag --repo ${{ github.repository }} --json assets -q '.assets[].name' `
                    | Where-Object { $_ -like '*-setup.exe' } | Select-Object -First 1)
          if (-not $asset) { throw "Aucun installeur NSIS trouve dans la release $tag" }
          Write-Host "Tag: $tag / asset: $asset"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      # Ce depot etant PUBLIC, l'asset de la Release GitHub est deja une URL stable et publiquement
      # accessible (jamais ecrasee) : pas besoin d'un bucket/CDN intermediaire, alors que winget
      # exige une URL d'installeur stable par version.
      #
      # PREREQUIS : le paquet doit avoir ete soumis une premiere fois a la main (`wingetcreate new`,
      # PR ouverte et mergee sur microsoft/winget-pkgs). Tant que ce n'est pas fait, `update`
      # echoue puisqu'il n'y a rien a mettre a jour.
      - name: wingetcreate update
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          INSTALLER_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/${{ steps.release.outputs.asset }}
        shell: pwsh
        run: |
          # Le fork personnel prend du retard sur microsoft/winget-pkgs, depot a tres fort
          # trafic, et wingetcreate echoue alors en affirmant que le fork n'a pas pu etre
          # synchronise. Resynchronisation prealable.
          #
          # BLOQUANT depuis le 2026-09-18, et c'est tout l'interet du changement. En simple
          # avertissement, l'etape enchainait sur un `wingetcreate update` deja condamne,
          # qui echouait une minute plus tard sur un message ne nommant pas la cause : on
          # allait donc chercher la panne du cote du paquet ou du jeton. Un echec ici a une
          # cause probable unique, le fork a diverge de l'amont, et il se repare a la main.
          # Le retenter ne sert a rien.
          try {
            $sync = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/painteau/winget-pkgs/merge-upstream" `
              -Headers @{ Authorization = "Bearer $env:WINGET_PAT"; Accept = "application/vnd.github+json" } `
              -Body (@{ branch = "master" } | ConvertTo-Json) `
              -ContentType "application/json"
            Write-Host "fork winget-pkgs synchronise : $($sync.message)"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            Write-Host "::error title=Fork winget-pkgs non synchronise::HTTP $code. Le fork painteau/winget-pkgs ne peut pas etre avance sur master, donc wingetcreate travaillerait sur une base perimee. Cause la plus frequente : le fork a diverge de microsoft/winget-pkgs et doit etre remis a plat a la main, ou supprime et refourche. Detail : $_"
            exit 1
          }

          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

          # Essai a blanc : tout le chemin reel (recherche de l'installeur, synchro du fork,
          # telechargement et empreinte, generation du manifeste) SAUF l'ouverture de la PR. C'est
          # ce qui permet d'eprouver ce workflow sans version nouvelle a publier.
          if ($env:DRY_RUN -eq 'true') {
            $essai = Join-Path $env:RUNNER_TEMP "winget-essai"
            Remove-Item -Recurse -Force $essai -ErrorAction SilentlyContinue
            .\wingetcreate.exe update Breizhzion.BeamMeUp `
              --version $env:VERSION `
              --urls "$env:INSTALLER_URL" `
              --token $env:WINGET_PAT `
              --out $essai
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::wingetcreate update a echoue (rc=$LASTEXITCODE)"; exit 1 }
            Get-ChildItem -Path $essai -Recurse -Filter "*.yaml" | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName
            }
            Write-Host "ESSAI A BLANC : manifeste genere, aucune pull request ouverte."
            exit 0
          }

          .\wingetcreate.exe update Breizhzion.BeamMeUp `
            --version $env:VERSION `
            --urls "$env:INSTALLER_URL" `
            --token $env:WINGET_PAT `
            --submit `
            --no-open
