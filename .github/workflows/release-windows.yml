name: Release Windows (Tauri)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0), empty means latest vX.Y.Z tag'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

# Serialise les executions de ce workflow au lieu de les laisser se croiser.
#
# PREVENTIF ici, et il faut le dire : aujourd'hui chaque execution publie sur le tag de SA
# version, donc une ancienne qui finirait en dernier n'ecrase rien. Le garde-fou est pose
# avant la chose qu'il protege, c'est-a-dire l'alignement en cours qui va ajouter un
# manifeste et un fichier au nom generique partages entre versions.
#
# C'est a ce moment-la que le defaut devient reel, et il a deja frappe ailleurs : sur
# justmakeq le 2026-09-06, beta.102 partie 34 min avant beta.103 a fini 14 min apres elle,
# et a republie la version precedente par-dessus la nouvelle. Un lire-modifier-ecrire sans
# garde fait gagner le dernier qui ecrit, quelle que soit sa version.
#
# `cancel-in-progress: false` est le point important : annuler mettrait fin a une release en
# cours de publication. Mettre en file conserve l'ordre des tags.
concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # windows-latest (GitHub-hosted) et non un runner self-hosted : recommandation standard
    # GitHub pour un repo PUBLIC (un runner self-hosted expose l'infrastructure a un risque
    # d'execution de code non maitrise). windows-latest inclut deja Rust + Visual Studio
    # Build Tools (C++), pas d'install a faire.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version depuis le tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ref = $env:INPUT_TAG
          if (-not $ref) { $ref = $env:GITHUB_REF_NAME }
          if ($ref -notlike 'v*.*.*') { $ref = (git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*') }
          $version = $ref.TrimStart('v')
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          (Get-Content app/package.json -Raw) -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`"" | Set-Content app/package.json -NoNewline
          (Get-Content app/src-tauri/tauri.conf.json -Raw) -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`"" | Set-Content app/src-tauri/tauri.conf.json -NoNewline
          (Get-Content app/src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "\d+\.\d+\.\d+"', "version = `"$version`"" | Set-Content app/src-tauri/Cargo.toml -NoNewline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances npm
        working-directory: app
        run: npm ci

      - name: Build Tauri (MSI + NSIS)
        working-directory: app
        run: npm run tauri build

      - name: Signer les installateurs (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: app/src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` etait faux ici, et faux d'une facon qui ne se voit pas.
          #
          # Sur un push de tag il vaut le tag, donc tout marche. Sur un
          # `workflow_dispatch` depuis la branche par defaut il vaut « main », et
          # `action-gh-release` CREE alors un tag git nomme « main » et y attache la
          # release. Ce n'est pas theorique : c'est arrive sur hublot, qui porte un tag
          # `main` a cote de `v0.1.0` avec sa release courante posee dessus, d'ou une URL
          # d'installateur `/download/main/...` que winget refuse puisqu'elle n'est pas
          # immuable par version. Ici le bug etait encore latent, uniquement parce que ce
          # workflow n'avait jamais ete lance a la main.
          #
          # Le piege est double : il ne tire que sur le chemin manuel, qui existe
          # precisement pour rejouer une release, donc il frappe quand on est deja en train
          # de reparer quelque chose.
          #
          # La bonne reponse etait deja dans ce depot : `release-linux.yml` reconstruit le
          # tag depuis la version. Aligne dessus plutot que d'introduire une troisieme
          # facon de nommer un tag.
          tag_name: v${{ steps.version.outputs.version }}
          name: BeamMeUp ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
